version: '3.7'

services:
  db:
    image: postgres:17-alpine
    container_name: cuentas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cuentas
      POSTGRES_USER: cuentas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Bogota
    volumes:
      - cuentas_pg:/var/lib/postgresql/data

  api:
    build: .
    container_name: cuentas_api
    restart: unless-stopped
    depends_on:
      - db
    env_file: .env
    environment:
      DATABASE_URL: postgres://cuentas:${POSTGRES_PASSWORD}@db:5432/cuentas
      FILES_DIR: /data/files
      TZ: America/Bogota
    volumes:
      - cuentas_files:/data/files
    # Solo accesible desde el propio servidor; el público entra por Caddy (HTTPS).
    ports:
      - "127.0.0.1:3100:3100"

  caddy:
    image: caddy:2-alpine
    container_name: cuentas_caddy
    restart: unless-stopped
    depends_on:
      - api
    # Solo 443: el puerto 80 lo usa otro proyecto; el certificado se obtiene por TLS-ALPN en 443.
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  cuentas_pg:
  cuentas_files:
  caddy_data:
  caddy_config:
